<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counselor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #5b6472;
      --paper: #f7f5f0;
      --card: #ffffff;
      --accent: #2f6f62;
      --accent-dark: #24574d;
      --line: #ded8cc;
      --error: #9b2c2c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      resize: vertical;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      color: inherit;
      background: #fffdf8;
    }

    textarea:focus {
      outline: 3px solid rgba(47, 111, 98, 0.2);
      border-color: var(--accent);
    }

    button {
      margin-top: 14px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: wait; }

    #answer {
      margin-top: 24px;
      padding: 18px;
      border-radius: 14px;
      background: #f2f7f5;
      border: 1px solid #cfe1db;
      white-space: pre-wrap;
    }

    #error {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #fdf2f2;
      border: 1px solid #f0caca;
      color: var(--error);
    }

    @media (max-width: 520px) {
      main { padding: 22px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Counselor</h1>
    <p class="intro">
      Not sure what could happen next? Describe the decision you are facing,
      and Counselor will help you see some possibilities.
    </p>

    <form id="ask">
      <label for="message">What are you trying to plan?</label>
      <textarea
        id="message"
        name="message"
        rows="4"
        placeholder="For example: I am deciding whether to join a club this term."
        required
      ></textarea>
      <button type="submit">Show me possibilities</button>
    </form>

    <section id="answer" aria-live="polite" hidden></section>
    <p id="error" role="alert" hidden></p>
  </main>

  <script>
    const form = document.querySelector('#ask');
    const message = document.querySelector('#message');
    const button = form.querySelector('button');
    const answer = document.querySelector('#answer');
    const error = document.querySelector('#error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      answer.hidden = true;
      button.disabled = true;
      button.textContent = 'Thinking...';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message.value }),
        });
        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error((data.error && data.error.message) || 'Something went wrong.');
        }

        answer.textContent = data.answer;
        answer.hidden = false;
      } catch (problem) {
        error.textContent = problem.message;
        error.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = 'Show me possibilities';
      }
    });
  </script>
</body>
</html>
